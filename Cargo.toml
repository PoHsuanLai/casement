[workspace]
resolver = "3"
# The pure crates (P0-Z1), then the smithay-facing crates, the composition root, the binaries
# and the test kit (P0-Z2; ARCHITECTURE.md section 1). `wlcs-casement` and `casement-scene-css`
# are never members (boundary row B16): each carries its own `[workspace]` table.
members = [
  "crates/casement-core",
  "crates/casement-layout",
  "crates/casement-motion",
  "crates/casement-render",
  "crates/casement-chrome",
  "crates/casement-icons",
  "crates/casement-wayland",
  "crates/casement-backend",
  "crates/casement-agent",
  "crates/casement-ipc",
  "crates/casement-privacy",
  "crates/casement",
  "crates/casementctl",
  "crates/casement-testclient",
  "crates/casement-testkit",
]
exclude = ["wlcs-casement", "casement-scene-css"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml (1.98.1).
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/casement"
publish = false

[workspace.dependencies]
casement-core   = { path = "crates/casement-core" }
casement-layout = { path = "crates/casement-layout" }
casement-motion = { path = "crates/casement-motion" }
casement-render = { path = "crates/casement-render" }
casement-chrome = { path = "crates/casement-chrome" }
casement-icons = { path = "crates/casement-icons" }
casement-wayland = { path = "crates/casement-wayland" }
casement-backend = { path = "crates/casement-backend" }
casement-agent = { path = "crates/casement-agent" }
casement-ipc = { path = "crates/casement-ipc" }
casement-privacy = { path = "crates/casement-privacy" }
# No default features: the real session (features `tty`, `libinput`) is the binary's, and a
# headless consumer builds with no system libraries (A2).
casement = { path = "crates/casement", default-features = false }
casement-testclient = { path = "crates/casement-testclient" }
casement-testkit = { path = "crates/casement-testkit" }

# Sibling repos, by path (each checkout sits beside this one; a lane worktree links them).
casement-protocols = { path = "../casement-protocols" }
# The one desktop client library (toplevels, workspaces, outputs, output capture): `casementctl
# shot` uses its wire layer, the test client its reducer and Frame.
desktop-client = { path = "../casement-protocols/desktop-client" }
# The verbs casement's keymap sends sill, the type sill's command line parses back.
shell-verbs = { path = "../casement-protocols/shell-verbs" }
porter-core        = { path = "../porter/crates/porter-core" }
# accountd's D-Bus proxies: casement-ipc registers the Spaces it mints (`Spaces1.Register`).
porter-dbus        = { path = "../porter/crates/porter-dbus" }
# quire's pure crates without dioxus (S0-QM1): the compositor never links a UI framework.
ds-core   = { path = "../quire/crates/ds-core", default-features = false }
ds-style  = { path = "../quire/crates/ds-style", default-features = false }
ds-motion = { path = "../quire/crates/ds-motion", default-features = false }
ds-behaviour = { path = "../quire/crates/ds-behaviour" }
# The safe file reader and writer every quire crate shares (`read_capped`, `write_atomic`, `move_aside`): the privacy book (`casement-privacy`).
ds-helpers = { path = "../quire/crates/ds-helpers", default-features = false }
# The desktop's keymap (chordkit's layers) and keycap's program end, `KeycapSource`: casement
# reads its shell bindings from them (`casement::keymap`). The revs are the ones sill, quire and
# cua pin.
chordkit      = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "eb0deff12add543565ec41eecffda646ede43cf0" }
keycap-client = { git = "https://github.com/PoHsuanLai/keycap", rev = "93161c434af47d8341734a770ee2aa6df0697f0e" }
# Which program is calling (caller identity): the bus adapter (casement-ipc checks every
# `org.quire.Compositor1` call with it, on casement's tokio runtime) and the pure vocabulary
# (casement-agent names the roles). The desktop's role names; the `fake` seams are a dev
# dependency of casement-ipc only (the desktop gate greps `cargo tree -e features` for them).
peephole-bus  = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.9", default-features = false, features = ["desktop", "tokio"] }
peephole-core = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.9", features = ["desktop"] }
# The stored settings document (C45, B13): casement and casement-ipc only.
# `quire-desktop`: the settings portal, so `theme = "system"` follows the desktop (wave-2026-10-15/chrome2 ask).
ds-settings = { path = "../quire/crates/ds-settings", default-features = false, features = ["quire-desktop"] }

# ---- From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim: only the lines this
# workspace names.
thiserror  = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "1"
proptest   = "1"
tempfile   = "3"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
# App icons by theme name (casement-icons): the XDG icon-theme lookup, and SVG to pixels.
freedesktop-icons = "0.4"
resvg = { version = "0.48.1", default-features = false }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
calloop = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"] }
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process", "pipe"] }
# Only for `SO_PEERPIDFD` (the kernel's pidfd of a socket's connector), which rustix 1.1 has no safe
# wrapper for (NEW-CASB-7; the owner allowed nix 2026-10-17).
nix = { version = "0.31", default-features = false, features = ["socket"] }
x11rb = { version = "0.13", features = ["res"] }
# The local wall-clock time and the system time zone (casement's night light tick).
jiff = "0.2"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# Pinned for later phases (A14): casement-agent's EIS (P4), the capture source (P2), the tty
# session (P1). No crate names them at P0; smithay's own `reis` and `libseat` lines resolve to
# the same majors.
reis = "0.7"
pipewire = "0.10"

# ---- The text stack, for casement-chrome alone (B11, B15): parley lays out the window title with
# fontique's system fonts, vello_cpu rasterises it. The versions are quire's (parley from its pinned
# block, vello_cpu at the fork rev quire's Cargo.toml patches in), so one copy of each is built.
parley    = { version = "0.11.1", default-features = false, features = ["std", "system"] }
vello_cpu = { git = "https://github.com/PoHsuanLai/vello", rev = "3e43d4af1f1955f2efc2cd52e50350811a1386ca" }

# ---- Not in quire's pinned block (FINDINGS: dependencies added here). taffy is the rev quire's
# Cargo.lock resolves through Blitz (SP1, A14), named directly because casement-layout takes
# taffy alone; only `casement-layout/src/taffy_bridge/` names it (boundary row B2).
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "4863877b9cab21645b160d7f247901f90214fe27", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout"] }

# smithay (C2, A14): our fork `PoHsuanLai/smithay`, which starts at upstream rev 118e34ff (master
# 2026-09-30, SP1). The pin is a commit of the fork's branch `casement-textinput`, which carries these
# patches (QUIRKS and FINDINGS name each): the xdg_surface role-object errors, wl_region's negative
# sizes, text-input `enter` and `leave` with keyboard focus without an input method, activation of an
# input method that binds late, `unavailable` to the new input method, a zero-size anchor rectangle,
# the fractional-scale and viewporter errors on their manager, the viewporter `bad_size` hook and
# check, buffer scale and transform applied at every commit, a popup pointer grab that leaves a
# nested popup's keyboard grab alone, and the consent gates of the protocols smithay serves whole
# (branch `lane/consent-gates`: `Gate` and a defaulted gate hook for data control, the input method and
# the foreign toplevel list, with `release` on each state), and `revoke` on each of those states and on the
# input method handle (branch `lane/revoke`, which ends the objects a power taken back leaves registered). Three more, from the fork's branch `lane/wlcs-w3-w4-w7`
# (wave 2 lane fork), are carried in the fork's master, which this rev pins: `get_xdg_surface` raising `role` and
# `invalid_surface_state`, `xdg_toplevel.wm_capabilities` at toplevel creation, and subsurface positions
# as state of the parent with a sync subtree applying only what it committed. `wl_surface.damage` with a
# negative size is ignored like `damage_buffer`, and `xdg_positioner.set_parent_size` with one too (fuzz seed 4 found both). Each patch is its own commit.
# Patches live only in the fork and nothing goes upstream (A13). No features here: each crate names the
# ones it uses, so the boundary rows see each crate's own graph. The union (the `casement`
# binary) is A14's list: wayland_frontend desktop renderer_gl renderer_pixman renderer_multi
# backend_winit backend_egl backend_drm backend_gbm backend_libinput backend_udev
# backend_session_libseat backend_libei backend_vulkan use_system_lib; renderer_test only
# under the `testing` feature; xwayland off until the Q-C5 gate.
smithay = { git = "https://github.com/PoHsuanLai/smithay", rev = "cf88ef5174c8bd763c8692cf6ec1d3080713b912", default-features = false }
# The client side of the test kit: the protocol extensions smithay serves from these crates.
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
# smithay requires 0.9; quire's block says 0.8 through sctk 0.20. The two never meet in one
# graph (casement links no sctk); recorded in FINDINGS (A14).
xkbcommon = { version = "0.9", features = ["wayland"] }
libseat = { version = "0.2", default-features = false }
# Logging: smithay logs through tracing; the binary installs the subscriber (`casement/src/log.rs`).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }

# Arithmetic that overflows is a bug, not a wrapped number, in the shipped compositor (CASC-19).
# keycap-client pins shell-verbs by git; casement reads the sibling checkout, so the git copy is
# patched to it and one ShellVerb type is built (the keymap test compares the two tables).
[patch."https://github.com/PoHsuanLai/casement-protocols"]
shell-verbs = { path = "../casement-protocols/shell-verbs" }

[profile.release]
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
