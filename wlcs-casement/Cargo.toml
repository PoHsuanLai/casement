# EXCLUDED from the casement workspace (boundary row B16): a cdylib that the wlcs test program
# (GPL-3.0, a separate process, never shipped; 21-FREEZE-AMENDMENTS A6) dlopens. This crate is MIT
# and links only the MIT `wlcs` crate, never wlcs' headers or sources. Built by dev/wlcs (lane
# P0-T-wlcs), outside the jail; run inside it.
[package]
name = "wlcs-casement"
description = "wlcs integration shim: wlcs_server_integration over a smithay stand-in compositor (DummyRenderer), behind the Compositor seam casement's fixture will implement."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace, so cargo never takes it into casement's.
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
# A37: the wlcs-only relaxation of "ack the initial configure before attaching a buffer"
# (smithay refuses it; wlcs' helpers attach first). It lives in `src/stand_in/relax.rs`; the same
# hook goes into casement's compositor handler behind casement's own `testing` feature.
default = ["testing"]
testing = []

[dependencies]
wlcs = "0.1"
# The libwayland-client handles wlcs passes (ffi.rs only); the version the wlcs crate uses.
wayland-sys = { version = "0.31.1", features = ["client", "server"] }
smithay = { git = "https://github.com/PoHsuanLai/smithay", rev = "576cfd954b6bd5badbd5f15d1708cafc941a0522", default-features = false, features = ["wayland_frontend", "desktop", "renderer_test"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
