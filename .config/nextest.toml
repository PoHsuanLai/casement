# Profiles named by dev/gate.sh (P0-Z2): fast for a lane's crates, merge and phase for the whole
# workspace. Ignored tests (frozen behaviour waiting for its fill lane) are skipped by default.
# Every test gets 10 s (20-FREEZE-PLAN §4.3): slow at 10 s, terminated at the first period.
[profile.default]
failure-output = "immediate-final"
fail-fast = false

[profile.fast]
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 1 }

[profile.merge]
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 1 }

[profile.phase]
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 1 }

# 3000 cases of a debug-built model run take 6 s alone and over 10 s beside the other tests on a
# loaded host (P0-exit: two timeouts at load 33 on 32 cores); the one property gets 30 s.
[[profile.fast.overrides]]
filter = 'package(casement-core) and test(random_runs_keep_every_invariant)'
slow-timeout = { period = "30s", terminate-after = 1 }

# 3000 cases of a debug-built model run take 6 s alone and over 10 s beside the other tests on a
# loaded host (P0-exit: two timeouts at load 33 on 32 cores); the one property gets 30 s.
[[profile.merge.overrides]]
filter = 'package(casement-core) and test(random_runs_keep_every_invariant)'
slow-timeout = { period = "30s", terminate-after = 1 }

# 3000 cases of a debug-built model run take 6 s alone and over 10 s beside the other tests on a
# loaded host (P0-exit: two timeouts at load 33 on 32 cores); the one property gets 30 s.
[[profile.phase.overrides]]
filter = 'package(casement-core) and test(random_runs_keep_every_invariant)'
slow-timeout = { period = "30s", terminate-after = 1 }
