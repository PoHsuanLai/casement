[package]
name = "casement-testclient"
description = "Typed wayland-client helpers per protocol for casement's tests, the Transcript every client keeps, test patterns and shm buffers; the casement-probe binary. Reaches no smithay (B9)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "casement-probe"
path = "src/bin/probe.rs"

# The X11 client of the XWayland suite (P1-X1).
[[bin]]
name = "casement-x11probe"
path = "src/bin/x11probe.rs"

[dependencies]
casement-core = { workspace = true }
casement-protocols = { workspace = true, features = ["client"] }
# The capture helpers fold events with its reducer and read its Frame; no wire layer (a fixture
# cannot answer its blocking round trips).
desktop-client = { workspace = true }
wayland-client = { workspace = true }
wayland-backend = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true }
wayland-protocols-misc = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
x11rb = { workspace = true }
# The probe's `shell-connect` asks org.quire.Compositor1 for the shell connection.
zbus = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The infrastructure tests run against the real compositor (a dev-dependency cycle cargo
# allows; B9 reads normal edges only).
casement-testkit = { workspace = true }

[lints]
workspace = true
