[package]
name = "casement-agent"
description = "casement's agent edge: the privileged-connection hand-out (P2), the agent seat, EIS, masked capture, the trusted surface and the kill chord (P4). A skeleton at P0."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
casement-core = { workspace = true }
smithay = { workspace = true, features = ["wayland_frontend"] }
# The remote EIS server (eis.rs; B14: no other crate names it). Already in the lock through
# smithay; the calloop feature gives the event-loop source.
reis = { workspace = true, features = ["calloop"] }
# Role names only (`roles::SHELL`, `AGENT_TIER`, `PORTAL`): what a caller proved on the bus,
# no bus and no process reading in this crate.
peephole-core = { workspace = true }

[lints]
workspace = true
