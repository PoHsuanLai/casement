[package]
name = "casement-wayland"
description = "casement's protocol edge: one module per Wayland protocol, each a sub-state (Part) plus on_* functions turning requests into core events and apply_* functions carrying effects onto the wire; smithay's bools and loose integers become our types here."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
casement-core = { workspace = true }
casement-protocols = { workspace = true, features = ["server"] }
porter-core = { workspace = true }
ds-core = { workspace = true }
smithay = { workspace = true, features = ["wayland_frontend", "desktop"] }
# The seat's keymap as text for the EIS keyboards (`seat_keymap::keymap_text`).
xkbcommon = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[features]
# The private `quire_*` servers (`quire_desktop_manager_v1`, `quire_shell_v1`; A8): a consumer that
# wants the standard protocol set alone takes the crate with `default-features = false`. The
# composition root needs them.
default = ["quire"]
quire = []
