[package]
name = "casement"
description = "casement, the desktop's Wayland compositor: the composition root (State, the smithay delegates, the protocol handlers, exec, the clock, the settings document) and the binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "casement"
path = "src/main.rs"
# The real session needs the device libraries (A2): a build without the default features is the
# headless library only (what the test kit, cua's tests and a harness take).
required-features = ["tty", "libinput"]

[dependencies]
casement-core = { workspace = true }
casement-layout = { workspace = true }
casement-motion = { workspace = true }
casement-render = { workspace = true }
casement-icons = { workspace = true }
casement-chrome = { workspace = true }
casement-wayland = { workspace = true, features = ["quire"] }
casement-backend = { workspace = true }
casement-agent = { workspace = true }
casement-ipc = { workspace = true }
casement-privacy = { workspace = true }
casement-protocols = { workspace = true, features = ["server"] }
porter-core = { workspace = true }
ds-helpers = { workspace = true }
ds-core = { workspace = true }
ds-settings = { workspace = true }
chordkit = { workspace = true }
keycap-client = { workspace = true }
# A14's feature list, the union the binary links (xwayland off until the Q-C5 gate). The device
# backends (drm, gbm, libinput, udev, libseat) come with the `tty` and `libinput` features below.
smithay = { workspace = true, features = [
  "wayland_frontend",
  "desktop",
  "renderer_gl",
  "renderer_pixman",
  "renderer_multi",
  "backend_winit",
  "backend_egl",
  "backend_libei",
  "backend_vulkan",
  "use_system_lib",
] }
calloop = { workspace = true }
jiff = { workspace = true }
x11rb = { workspace = true }
rustix = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[features]
# The real session (A2): the tty backend's adapters (libseat, udev, DRM, GBM) and libinput. On by
# default so `cargo build -p casement` makes the compositor; a headless consumer takes the
# library with `default-features = false` (the workspace dependency does).
default = ["tty", "libinput"]
tty = ["casement-backend/tty"]
libinput = ["casement-backend/libinput"]
# Headless tests only (B10): the test kit builds casement with it. A binary with it refuses
# every backend but headless and refuses to start outside the jail (jail_check.rs). It also reads
# test caller rows from the injected folder (`clients/dev_callers.rs`), hence `dev-rows`.
testing = ["casement-render/testing", "casement-backend/testing", "casement-ipc/dev-rows"]
# casementctl's Debug1 on the private bus (B10); the same refusals as `testing`.
debug-inject = ["casement-ipc/debug-inject", "casement-backend/debug-inject", "casement-ipc/dev-rows"]

[lints]
workspace = true
