[package]
name = "casement-testkit"
description = "casement's one test harness: Fixture over the real State on the headless backend, test origins, fakes (session, udev, logind, palmrest), the soft GPU topology, golden helpers and typed fuzz ops; the fake-logind binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fake-logind"
path = "src/bin/fake_logind.rs"

[[bin]]
name = "writeback-compare"
path = "src/bin/writeback_compare.rs"

[dependencies]
casement = { workspace = true, features = ["testing"] }
casement-core = { workspace = true }
casement-layout = { workspace = true }
casement-render = { workspace = true, features = ["testing"] }
casement-backend = { workspace = true, features = ["testing"] }
casement-wayland = { workspace = true }
casement-ipc = { workspace = true }
casement-testclient = { workspace = true }
casement-protocols = { workspace = true, features = ["client"] }
porter-core = { workspace = true }
ds-core = { workspace = true }
smithay = { workspace = true, features = ["wayland_frontend", "renderer_pixman", "renderer_multi", "backend_session"] }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
rustix = { workspace = true }
proptest = { workspace = true }

[dev-dependencies]
wayland-client = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
