[package]
name = "casement-ipc"
description = "casement's D-Bus servers: org.quire.Compositor1 (P2) and, under feature debug-inject, org.quire.Casement.Debug1 with its inject and wait grammars."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
casement-core = { workspace = true }
# Only `VirtualOutputSpec` for the Debug1 object: a release build links neither the backend nor
# smithay.
casement-backend = { workspace = true, optional = true }
# `Fraction`, the pinch scale in the inject grammar.
ds-core = { workspace = true }
porter-core = { workspace = true }
# `SpacesProxy::register`: the compositor registers the Spaces it mints with accountd.
porter-dbus = { workspace = true }
ds-settings = { workspace = true }
calloop = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
# Keysym names in the inject grammar (`key Return down`).
xkbcommon = { workspace = true }

[features]
# org.quire.Casement.Debug1 on the private bus (B10): never in a release build.
debug-inject = ["dep:casement-backend", "casement-backend/debug-inject"]

[lints]
workspace = true
