[package]
name = "casement-ipc"
description = "casement's D-Bus servers: org.quire.Compositor1 (P2) and, under feature debug-inject, org.quire.Casement.Debug1 with its inject and wait grammars."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
casement-core = { workspace = true }
# Only `VirtualOutputSpec` for the Debug1 object: a release build links neither the backend nor
# smithay.
casement-backend = { workspace = true, optional = true }
# `Fraction`, the pinch scale in the inject grammar.
ds-core = { workspace = true }
porter-core = { workspace = true }
# `SpacesProxy::register`: the compositor registers the Spaces it mints with accountd.
porter-dbus = { workspace = true }
# `live`: `org.quire.SettingsModule1`, the way Settings reads and changes the Privacy list.
ds-settings = { workspace = true, features = ["live"] }
calloop = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# Which program is calling: every Compositor1 call and every Privacy call is checked with it.
peephole-bus = { workspace = true }
# `WireCode::ALL` and `Power`: the section list of the Privacy module (the vocabulary's one home).
casement-protocols = { workspace = true }
# The refusal of a call is logged once, with the role asked and the standing found.
tracing = { workspace = true }
# Keysym names in the inject grammar (`key Return down`).
xkbcommon = { workspace = true }

[dev-dependencies]
# `BusPeers::introduce`, `FixtureProc`: the tests make a sender stand as a chosen caller on a
# private bus and never read the real `/proc` for it.
peephole-bus = { workspace = true, features = ["fake"] }

[features]
# org.quire.Casement.Debug1 on the private bus (B10): never in a release build.
debug-inject = ["dep:casement-backend", "casement-backend/debug-inject"]
# Developer rows (peephole's `dev-rows`): a program named in a file the person owns is a desktop
# service at `Proof::Dev`, and `dbus::require` lets exactly that proof in. Only casement's
# `testing` and `debug-inject` turn it on; a shipped build never has it (the desktop gate greps
# `cargo tree -e features` for `dev-rows`).
dev-rows = ["peephole-bus/dev-rows"]

[lints]
workspace = true
